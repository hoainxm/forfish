apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
// Java 21 đặt ở capacitor.build.gradle (sinh tự động); Kotlin phải cùng đích
kotlin { jvmToolchain(21) }
apply plugin: 'com.github.triplet.play'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "vn.sdvico.sdfish"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "vn.sdvico.forfish"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // NGUỒN DUY NHẤT của số phiên bản (2026-11-13): mỗi lần phát hành TĂNG versionCode đúng 1 + đổi
        // versionName ngay ở hai dòng dưới, commit cùng bản phát hành. Build tay lẫn CI (android-release.yml)
        // đều đọc từ đây; -PappVersionCode/-PappVersionName chỉ để ĐÈ khi cần (vd thử nội bộ).
        // ⚠ KHÔNG sinh số theo giờ (%y%j%H%M, bỏ 13/11): Play Console CHẶN ĐỎ bản 263170430 nhảy từ 4 —
        // "version code is significantly higher than your previous version code". 13/11/2026: số 5 đã dùng trên Play
        // (bản 1.0.4 có LiteRT, không phát hành) ⇒ 1.0.4 phát hành bằng 6.
        versionCode (project.hasProperty('appVersionCode') ? project.property('appVersionCode').toString().toInteger() : 6)
        versionName (project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : "1.0.4")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    // CỜ senBienGemma (2026-11-13) — Gemma của Sen Biển (ADR 0012) CHỈ vào bản build khi bật RÕ RÀNG:
    //   -PsenBienGemma=true ⇒ gắn gói on-demand :sen-bien-gemma (mô hình 62 MB, Play Asset Delivery) + giữ thư viện
    //   native LiteRT. Bật mà thiếu file mô hình ⇒ DỪNG build (không lặng lẽ ra bản "có LiteRT mà không có Gemma").
    //   Mặc định TẮT ⇒ bỏ liblitertlm*.so khỏi bản cài và không gắn gói, kể cả khi máy có sẵn file mô hình.
    // Vì sao mặc định tắt: LiteRT-LM chỉ có .so 64-bit (arm64-v8a, x86_64) ⇒ có nó là Play loại MỌI máy 32-bit —
    // bản 1.0.4 (13/11) bị Play báo "no longer supports 19,575 devices" so với 1.0.3, trong khi bản đó KHÔNG kèm
    // mô hình (Gemma không chạy). ADR 0012 còn ghi Gemma "chặn phát hành" tới khi thử điện thoại thật. Tắt cờ thì
    // app không có Gemma: plugin vẫn đăng ký nhưng trả "chưa có mô hình", Sen Biển chạy n-gram + luật như web.
    // Bật lại = quyết định ĐỔI máy 32-bit lấy Gemma — của chủ dự án, ghi vào ADR 0012 trước khi phát hành.
    def senBienGemma = (project.findProperty('senBienGemma') ?: 'false').toString() == 'true'
    def gemmaModel = rootProject.file("sen-bien-gemma/src/main/assets/sen-bien/gemma.litertlm")
    if (senBienGemma) {
        if (!gemmaModel.exists()) {
            throw new GradleException("senBienGemma=true nhưng thiếu ${gemmaModel} — chép mô hình vào (hoặc bỏ cờ để build bản không Gemma)")
        }
        assetPacks = [":sen-bien-gemma"]
    } else {
        packaging {
            jniLibs {
                excludes += ['**/liblitertlm*.so']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Sen Biển Gemma (ADR 0012): LiteRT-LM chạy .litertlm trên CPU · Play Asset Delivery tải gói on-demand
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.18.0"
    implementation "com.google.android.play:asset-delivery-ktx:2.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// --- Gradle Play Publisher (CI upload) ---------------------------------------
// Credential lấy từ env ANDROID_PUBLISHER_CREDENTIALS (nội dung JSON service
// account) → KHÔNG commit file. Không set env (build local) thì task publish*
// bỏ qua, task build vẫn chạy bình thường.
// Track mặc định 'internal' (an toàn — chỉ tester); -PplayTrack=production để đẩy live.
play {
    track.set(project.hasProperty('playTrack') ? project.property('playTrack').toString() : "internal")
    defaultToAppBundles.set(true)
    // 'completed' = phát hành ngay trong track; đổi 'draft' nếu muốn giữ nháp.
    releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.COMPLETED)
}
