# GHI BẢN TIN BÃO VÀO KHO — gọi /api/cron/refresh-storms để đọc bản tin NCHMF
# mới nhất và thêm một hàng vào `storm_bulletins` (+ các mốc dự báo). Kho đó là
# nền để bản đồ vẽ đoạn cơn ĐÃ ĐI và đoạn SẮP TỚI (migration 0036).
#
# ⚠️ NHỊP THẬT KHÔNG NẰM Ở ĐÂY. Lịch dưới là NHỊP GÕ CỬA (1 giờ/lần); route tự
# quyết có hỏi nguồn hay không bằng `nhipQuet()` (src/lib/storm-scan.ts, 0037):
#   · trời yên            → 1 lần/ngày
#   · bão còn xa bà con   → theo mốc NGUỒN tự hẹn ("Bản tin tiếp theo: …"),
#                           thường 6 giờ/lần
#   · bão vào ≤500 km cảng, hoặc từ cấp 10 → 1 giờ/lần
# Lượt bị cổng chặn KHÔNG chạm mạng ngoài — chỉ một câu đọc kho rồi trả
# `{"ok":true,"scanned":false,...}`. Số request thật ra NCHMF khi trời yên vì
# thế là 1/ngày thay vì 48/ngày như bản đầu.
#
# Vì sao gõ cửa 1 giờ/lần chứ không thưa hơn: đó là NHỊP DÀY NHẤT mà mức "gần"
# cần. Cron của GitHub không tự đổi lịch theo tình hình, nên phải gõ ở nhịp dày
# nhất rồi để cổng lọc — chứ không phải để lịch thưa rồi lỡ mất diễn biến đúng
# lúc bão áp bờ.
#
# VÌ SAO CHẠY Ở ĐÂY CHỨ KHÔNG PHẢI VERCEL CRON: gói Hobby chỉ cho 2 cron, mà 4
# chỗ trong vercel.json đã dùng hết suất — trong đó `notify-storms` (đẩy thông
# báo bão) là thứ KHÔNG được nhường chỗ. Actions chết thì hậu quả là bản đồ
# thiếu một khúc đường, chứ KHÔNG mất cảnh báo bão — cảnh báo đi đường riêng.
#
# CẦN CẤU HÌNH (dùng chung với các workflow cron khác):
#   · Variable  APP_BASE_URL  = URL production
#   · Secret    CRON_SECRET   = TRÙNG env CRON_SECRET trên Vercel
name: refresh-storms

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bỏ qua cổng nhịp, quét ngay (dựng lại khúc đường vừa hụt)"
        type: boolean
        default: false

concurrency:
  group: refresh-storms
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi cron ghi bản tin bão
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Thiếu vars.APP_BASE_URL hoặc secrets.CRON_SECRET"; exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          Q=""
          if [ "$FORCE" = "true" ]; then Q="?force=1"; fi
          code=$(curl -sS -o resp.json -w "%{http_code}" -m 90 -L \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/refresh-storms$Q")
          echo "HTTP $code"; cat resp.json; echo
          # 503 = NGUỒN đang hỏng (NCHMF bảo trì / đọc không nổi bản tin), KHÔNG
          # phải lỗi của mình — để job đỏ ở ca đó là dạy nhau bỏ qua màu đỏ.
          # Lượt sau tự thử lại; chỉ 200 và 503 là chấp nhận được.
          test "$code" = "200" || test "$code" = "503"
