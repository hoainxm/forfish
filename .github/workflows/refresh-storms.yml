# GHI BẢN TIN BÃO VÀO KHO — gọi /api/cron/refresh-storms để đọc bản tin NCHMF
# mới nhất và thêm một hàng vào `storm_bulletins` (+ các mốc dự báo). Kho đó là
# nền để bản đồ vẽ đoạn cơn ĐÃ ĐI và đoạn SẮP TỚI (migration 0036).
#
# VÌ SAO CHẠY Ở ĐÂY CHỨ KHÔNG PHẢI VERCEL CRON: gói Hobby chỉ cho 2 cron/ngày,
# mà 4 chỗ trong vercel.json đã dùng hết suất — trong đó `notify-storms` (đẩy
# thông báo bão) là thứ KHÔNG được nhường chỗ. GitHub Actions chạy nhịp dày
# miễn phí, và nếu Actions chết thì hậu quả là bản đồ thiếu một khúc đường, chứ
# KHÔNG mất cảnh báo bão — cảnh báo đi đường riêng.
#
# NHỊP 30 PHÚT: NCHMF phát 3–6 giờ/lần (bão khẩn cấp 1 giờ/lần). Phần lớn lượt
# sẽ trả `{"ok":true,"saved":0,"reason":"da-co"}` — đúng như thiết kế, unique
# (storm_key, issued_at) ở DB làm trọng tài chứ không phải nhịp gọi.
# ⚠️ Lịch cron của GitHub hay TRỄ vài phút khi hạ tầng bận; 30 phút là mức nhịp
# chịu được trễ đó mà vẫn không bỏ sót bản tin nào.
#
# CẦN CẤU HÌNH (dùng chung với các workflow cron khác):
#   · Variable  APP_BASE_URL  = URL production
#   · Secret    CRON_SECRET   = TRÙNG env CRON_SECRET trên Vercel
name: refresh-storms

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-storms
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi cron ghi bản tin bão
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Thiếu vars.APP_BASE_URL hoặc secrets.CRON_SECRET"; exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          code=$(curl -sS -o resp.json -w "%{http_code}" -m 90 -L \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/refresh-storms")
          echo "HTTP $code"; cat resp.json; echo
          # 503 = NGUỒN đang hỏng (NCHMF bảo trì / đọc không nổi bản tin), KHÔNG
          # phải lỗi của mình — để job đỏ ở ca đó là dạy nhau bỏ qua màu đỏ.
          # Lượt 30 phút sau tự thử lại; chỉ 200 và 503 là chấp nhận được.
          test "$code" = "200" || test "$code" = "503"
