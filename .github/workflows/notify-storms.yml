# ĐẨY THÔNG BÁO BÃO — gọi /api/cron/notify-storms 30 phút/lần.
#
# ⚠️ VÌ SAO KHÔNG NẰM TRONG `vercel.json` (lỗi thật, 2026-08-18e): cron này TỪNG
# ở đó với lịch `*/30 * * * *`, và nó **chặn đứng toàn bộ deploy** trong 7 tiếng.
# Vercel từ chối NGAY LÚC TẠO deployment:
#
#     400 cron_jobs_limits_reached — "Hobby accounts are limited to daily cron
#     jobs. This cron expression (*/30 * * * *) would run more than once per day."
#
# Kiểu hỏng tệ nhất: KHÔNG có bản ghi deployment nào được tạo, nên bảng
# Deployments không hiện lỗi đỏ nào cả — nhìn vào chỉ thấy "bản mới nhất là bản
# hôm qua", không ai đoán được vì sao. Ba lần push liên tiếp im lặng trôi qua;
# chỉ khi gọi thẳng API tạo deploy mới đọc được câu lỗi trên.
# Bấm "Redeploy" cũng KHÔNG cứu được: nút đó dựng lại đúng commit của bản cũ.
#
# ⚠️ LUẬT CHO NGƯỜI SAU: tài khoản đang là **Hobby** ⇒ `vercel.json` chỉ được
# chứa cron chạy **tối đa 1 lần/ngày**. Cần nhịp dày hơn thì để ở GitHub Actions,
# như file này và `refresh-storms.yml`. Đổi sang Pro thì mới gộp lại được.
#
# Chức năng KHÔNG đổi: vẫn 30 phút/lần, vẫn Bearer CRON_SECRET, route tự lo khử
# trùng bằng `push_messages` và giờ khuya bằng `isQuietHoursVN`.
#
# CẦN CẤU HÌNH (dùng chung với các workflow cron khác):
#   · Variable  APP_BASE_URL  = URL production
#   · Secret    CRON_SECRET   = TRÙNG env CRON_SECRET trên Vercel
name: notify-storms

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: notify-storms
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi cron đẩy tin bão
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Thiếu vars.APP_BASE_URL hoặc secrets.CRON_SECRET"; exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          code=$(curl -sS -o resp.json -w "%{http_code}" -m 90 -L \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/notify-storms")
          echo "HTTP $code"; cat resp.json; echo
          # 503 = cả hai nguồn bão hỏng (route CỐ Ý không gửi bừa lúc đó), không
          # phải lỗi của mình. Lượt 30 phút sau tự thử lại.
          test "$code" = "200" || test "$code" = "503"
