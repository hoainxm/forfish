# Build AAB đã ký + (tùy chọn) đẩy lên CH Play tự động.
#
# KHI NÀO CHẠY: bấm tay (Actions → Run workflow) hoặc push tag vX.Y.Z.
#   KHÔNG chạy mỗi push — chế độ wrap (a) server.url nghĩa là đa số cập nhật chỉ
#   cần deploy web (server.url = https://sdfish.sdvico.vn từ 2026-10-27), không cần binary mới.
#   NGOẠI LỆ: đổi chính server.url (capacitor.config.ts) PHẢI phát hành AAB mới — URL nằm trong binary. Chỉ build khi đổi vỏ native / bump
#   version / đóng rejection. Xem docs/app-map/ops/build-publish-store.md §3b.
#
# SECRETS cần set (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — `base64 -w0 android/app/sdfish-release.keystore`
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — JSON service account (Play Console → API access),
#                               role tối thiểu "Release apps". Chỉ cần cho bước publish.
#
# LƯU Ý: workflow KHÔNG chạy `cap sync` lên platform mới — nó build từ android/ đã
# commit + sync lại web/plugin. Đổi icon/splash/plugin native thì chạy `npm run
# cap:sync` local + commit TRƯỚC. App content / Data safety / screenshot / tài
# khoản demo trên Play vẫn phải làm tay (§5 runbook).

name: Android release (build + publish CH Play)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "versionName hiển thị (vd 1.0.4). Bỏ trống = giữ mặc định build.gradle."
        required: false
        default: ""
      versionCode:
        description: "versionCode (số nguyên, lớn hơn bản trên Play ĐÚNG 1). Bỏ trống = đọc android/app/build.gradle."
        required: false
        default: ""
      track:
        description: "Play track"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
      publish:
        description: "Đẩy lên CH Play (cần PLAY_SERVICE_ACCOUNT_JSON). Bỏ = chỉ build AAB."
        required: true
        default: true
        type: boolean
      senBienGemma:
        description: "Kèm Gemma Sen Biển (LiteRT + gói 62 MB). ⚠ Play LOẠI MỌI MÁY 32-BIT. Chỉ bật khi ADR 0012 đã duyệt phát hành."
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    # CHỈ CHẠY Ở REPO CÔNG TY (rà soát 2026-09-04, mục B): cùng file này nằm ở
    # cả hai repo; không cổng là hễ repo Long có lại hạn mức Actions thì nguồn
    # ngoài bị gõ gấp đôi. So sánh chuỗi không phân biệt hoa thường.
    if: github.repository == 'sdvico/forfish'
    runs-on: ubuntu-latest
    # Trần thời gian (rà soát 2026-09-04, mục C): mặc định GitHub là 360 phút —
    # một lần treo tính đủ 6 giờ, bằng 18 % hạn mức tháng.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # versionCode = SỐ TRONG android/app/build.gradle (nguồn duy nhất, tăng 1 mỗi bản trong
      # commit phát hành) — ô nhập `versionCode` chỉ để đè. KHÔNG sinh theo giờ nữa (2026-11-13):
      # `%y%j%H%M` cho 263170430 nhảy từ 4 ⇒ Play Console CHẶN ĐỎ "version code is significantly
      # higher than your previous version code". KHÔNG dùng run_number (rà soát 2026-09-04, mục A):
      # mỗi repo một bộ đếm riêng. Ô nhập phải là số nguyên dương — sai thì dừng, không build mù.
      - name: Tính versionCode
        run: |
          CODE="${{ inputs.versionCode }}"
          if [ -n "$CODE" ] && ! [[ "$CODE" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::versionCode \"$CODE\" không phải số nguyên dương"; exit 1
          fi
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true # luôn lấy bản vá bảo mật mới nhất của dòng 24 LTS (runner cache có thể giữ bản cũ)
          cache: "npm"
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Xác định versionName
        id: ver
        run: |
          NAME="${{ inputs.versionName }}"
          if [ -z "$NAME" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"   # tag v1.0.4 -> 1.0.4
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=${APP_VERSION_CODE:-<mặc định build.gradle>}  versionName=${NAME:-<mặc định build.gradle>}"

      # Chế độ (a) server.url: web load từ sdfish.sdvico.vn lúc chạy. cap sync vẫn cần webDir
      # 'out' tồn tại để copy → tạo stub tối thiểu (bị server.url ghi đè runtime).
      - name: Stub web dir cho Capacitor (mode server.url)
        run: |
          mkdir -p out
          echo '<!doctype html><meta charset="utf-8"><title>SDFish</title><body>Đang tải SDFish…</body>' > out/index.html

      - name: Đồng bộ web + plugin sang android/
        run: npx cap sync android

      # KHOÁ ĐÍCH (2026-10-27): app từng trỏ một deploy đã bị tạm dừng (forfish-alpha ⇒ 503) mà build vẫn xanh.
      # Đỏ ngay nếu config sinh ra không trỏ web công ty, hoặc web đó không trả 200 cho trang chủ + /quyen-rieng-tu
      # (Play bắt buộc trang chính sách) — phát hành binary trỏ vào chỗ chết là bà con mở app ra trang lỗi.
      - name: Kiểm server.url trỏ web công ty còn sống
        run: |
          URL=$(node -e "console.log(require(./android/app/src/main/assets/capacitor.config.json).server.url)")
          echo "server.url = $URL"
          [ "$URL" = "https://sdfish.sdvico.vn/" ] || { echo "::error::server.url phải là https://sdfish.sdvico.vn/ (đang: $URL)"; exit 1; }
          for p in "" quyen-rieng-tu; do
            c=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "${URL}${p}")
            echo "${URL}${p} -> $c"
            [ "$c" = "200" ] || { echo "::error::${URL}${p} trả $c — không phát hành binary trỏ vào web đang hỏng"; exit 1; }
          done

      - name: Sinh lại launcher icon (đè icon mặc định Capacitor)
        run: npm run icons

      - name: Khôi phục keystore ký release
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KS_B64" | base64 -d > android/app/sdfish-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=sdfish-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # Gemma của Sen Biển (ADR 0012): CHỈ khi ô `senBienGemma` bật (mặc định TẮT, tag cũng tắt — 2026-11-13).
      # Lý do tắt: LiteRT-LM chỉ có .so 64-bit ⇒ bản kèm nó bị Play loại mọi máy 32-bit (1.0.4: −19.575 loại máy).
      # Bật ⇒ tải mô hình 62 MB từ GitHub Release của chính repo + kiểm SHA-256 (android/sen-bien-gemma/gemma.sha256);
      # thiếu release / sai hash ⇒ DỪNG (đã bật mà ra bản không Gemma là sai ý người chạy). Tắt ⇒ Gradle bỏ liblitertlm*.so.
      - name: Tải mô hình Gemma cho gói Play on-demand
        if: ${{ inputs.senBienGemma }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=android/sen-bien-gemma/src/main/assets/sen-bien
          gh release download sen-bien-gemma-v2 --repo "${{ github.repository }}" -p gemma.litertlm -D "$D" --clobber \
            || { echo "::error::Chưa có release sen-bien-gemma-v2 — bỏ tick senBienGemma để build bản không Gemma"; exit 1; }
          (cd "$D" && sha256sum -c ../../../../gemma.sha256) \
            || { echo "::error::Gemma sai SHA-256"; rm -f "$D/gemma.litertlm"; exit 1; }
          echo "Gemma: $(du -h "$D/gemma.litertlm" | cut -f1) — gắn gói senbiengemma"

      - name: Build AAB đã ký
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease \
            ${APP_VERSION_CODE:+-PappVersionCode=$APP_VERSION_CODE} \
            ${{ inputs.senBienGemma && '-PsenBienGemma=true' || '' }} \
            ${{ steps.ver.outputs.name && format('-PappVersionName={0}', steps.ver.outputs.name) || '' }}

      - name: Lưu AAB làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Đẩy lên CH Play
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        working-directory: android
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$ANDROID_PUBLISHER_CREDENTIALS" ]; then
            echo "::error::Thiếu secret PLAY_SERVICE_ACCOUNT_JSON — không publish được. Bỏ tick publish nếu chỉ muốn build."
            exit 1
          fi
          ./gradlew --no-daemon publishReleaseBundle \
            ${APP_VERSION_CODE:+-PappVersionCode=$APP_VERSION_CODE} \
            ${{ inputs.senBienGemma && '-PsenBienGemma=true' || '' }} \
            ${{ steps.ver.outputs.name && format('-PappVersionName={0}', steps.ver.outputs.name) || '' }} \
            -PplayTrack=${{ inputs.track || 'internal' }}
