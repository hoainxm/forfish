# Precompute DÒNG CHẢY THEO TẦNG — gọi /api/cron/refresh-currents-depth để tải
# Copernicus phy-cur P1D (4 tầng 0/50/150/300 m, ~9 ngày) và ghi snapshot
# curdepth:t*:d10 + d3. Nguồn ra bản mới 1 lần/ngày → 2 lượt/ngày là dư dả
# (lượt 2 vớt trường hợp nguồn phát hành muộn). Best-effort như các cron khác.
#
# CẦN CẤU HÌNH (dùng chung với refresh-fish/refresh-weather):
#   · Variable  APP_BASE_URL  = URL production
#   · Secret    CRON_SECRET   = TRÙNG env CRON_SECRET trên Vercel
name: refresh-currents-depth

on:
  schedule:
    # 05:50 · 17:50 UTC — sau giờ Copernicus thường cập nhật bản ngày
    - cron: "50 5,17 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-currents-depth
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi cron precompute
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Thiếu vars.APP_BASE_URL hoặc secrets.CRON_SECRET — BỎ QUA lần này (best-effort; client tự rơi về live). Set ở Settings→Secrets and variables→Actions của REPO DEPLOY (hoainxm) để cron chạy thật."; exit 0
          fi
          BASE_URL="${BASE_URL%/}"
          code=$(curl -sS -o resp.json -w "%{http_code}" -m 120 -L \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/refresh-currents-depth")
          echo "HTTP $code"; cat resp.json; echo
          test "$code" = "200"
