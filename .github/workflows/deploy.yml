name: Deploy Next.js via Self-hosted Runner

# Tối ưu thời gian (2026-09-29, trước đó ~20 phút/lần) — xem ops/runbook.md "Deploy self-host":
#   - checkout clean:false  → giữ node_modules + .next/cache giữa các lần (không build lạnh)
#   - npm ci CHỈ khi package-lock.json / bản Node đổi (node_modules 683 MB, 478 gói)
#   - bỏ setup-node `cache: npm` (runner tự host đã có ~/.npm trên đĩa, khỏi up/down GitHub)
#   - robocopy /MIR /MT chỉ chép file đổi; ráp bản mới ở thư mục stage khi web vẫn chạy,
#     PM2 chỉ dừng trong lúc tráo stage → live
#   - concurrency: 2 lần push liền nhau không chép chồng lên nhau

# CHỜ CI (rà Codex 2026-10-18): trước đây deploy và ci cùng nghe `push: main`,
# chạy song song, deploy KHÔNG phụ thuộc kết quả ci ⇒ commit đỏ test vẫn lên
# production. Giờ deploy chỉ chạy khi workflow `ci` của một push vào main KẾT
# THÚC XANH, và checkout ĐÚNG commit ci vừa gác (head_sha) — không phải đầu main
# lúc đó (main có thể đã đi tiếp sang commit chưa qua ci).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: # Bấm tay: tự chịu trách nhiệm, dùng khi cần đẩy lại bản đang ở main

# Xếp hàng, KHÔNG huỷ giữa chừng: huỷ đúng lúc đang tráo stage → live là web nằm chết
# (PM2 đã dừng, chưa khởi động lại).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # ci đỏ/huỷ ⇒ bỏ qua; chỉ lấy lượt ci của push (PR cũng chạy ci).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: self-hosted # Quan trọng: Chỉ định chạy trên máy chủ của bạn
    environment: production # Tên GitHub Environment chứa các Secrets/Variables

    env:
      # Lấy biến môi trường từ GitHub Secrets hoặc GitHub Repository Variables
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE || vars.NEXT_PUBLIC_API_BASE }}
      # Các biến tùy chọn khác (nếu có cấu hình trong GitHub)
      SDWORK_SUPABASE_URL: ${{ secrets.SDWORK_SUPABASE_URL || vars.SDWORK_SUPABASE_URL }}
      SDWORK_SUPABASE_ANON_KEY: ${{ secrets.SDWORK_SUPABASE_ANON_KEY || vars.SDWORK_SUPABASE_ANON_KEY }}
      SDWORK_WEBHOOK_SECRET: ${{ secrets.SDWORK_WEBHOOK_SECRET || vars.SDWORK_WEBHOOK_SECRET }}
      SDWORK_TRACE_URL: ${{ secrets.SDWORK_TRACE_URL || vars.SDWORK_TRACE_URL }}
      NEXT_PUBLIC_SDWORK_FUNCTIONS_URL: ${{ secrets.NEXT_PUBLIC_SDWORK_FUNCTIONS_URL || vars.NEXT_PUBLIC_SDWORK_FUNCTIONS_URL }}
      NEXT_PUBLIC_SDWORK_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SDWORK_ANON_KEY || vars.NEXT_PUBLIC_SDWORK_ANON_KEY }}
      CREW_CCCD_PEPPER: ${{ secrets.CREW_CCCD_PEPPER || vars.CREW_CCCD_PEPPER }}
      # Sen Biển hỏi máy nhà (ADR 0016): khoá cổng AI Assistant — sinh trên máy GPU bằng `node app/core/cli.mjs tao-khoa-cong`.
      # Thiếu ⇒ /api/sen-bien/hoi trả 503 chua_noi, Sen Biển nói câu trong máy (tắt êm).
      FORLIFE_GW_KEY: ${{ secrets.FORLIFE_GW_KEY }}
      FORLIFE_GW_URL: ${{ vars.FORLIFE_GW_URL }}
      SDFISH_RENEWAL_SECRET: ${{ secrets.SDFISH_RENEWAL_SECRET || vars.SDFISH_RENEWAL_SECRET }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      ADMIN_PHONES: ${{ secrets.ADMIN_PHONES || vars.ADMIN_PHONES }}
      MASTER_AGENT_PHONES: ${{ secrets.MASTER_AGENT_PHONES || vars.MASTER_AGENT_PHONES }}
      PORT: ${{ secrets.PORT || vars.PORT }}
      # Tăng tốc: không tải Chrome của puppeteer (chỉ dùng cho script quay video, deploy không cần)
      PUPPETEER_SKIP_DOWNLOAD: "true"
      # MÃ HOÁ public/data (rà Codex 2026-10-18): encode-data.mjs CHỈ chạy khi có
      # VERCEL=1 hoặc cờ này. Trước đây workflow không khai ⇒ phụ thuộc .env trên
      # server có cờ hay không; thiếu là dữ liệu RÕ lên production mà build xanh.
      SDFISH_ENCODE_DATA: "1"
      # Mã build = commit ĐANG build (next.config.ts), so ở bước health check.
      SDFISH_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
      # Thư mục trên server
      APP_DIR: C:\sdfish\forfish
      STAGE_DIR: C:\sdfish\forfish-next
      # Bản đang chạy TRƯỚC lần tráo — để quay lại khi health check sau tráo hỏng.
      PREV_DIR: C:\sdfish\forfish-prev

    steps:
      # 1. Kéo mã nguồn. clean:false để GIỮ node_modules + .next/cache (git clean -ffdx
      #    mặc định xoá cả hai ⇒ lần nào cũng cài lại + build lạnh). checkout vẫn --force
      #    nên file có trong git luôn đúng bản của commit.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          # workflow_run: đúng commit ci đã gác; bấm tay: đầu nhánh được chọn.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 2. Setup Node.js — KHÔNG `cache: npm`: trên runner tự host, ~/.npm đã nằm sẵn trên
      #    đĩa; cache của action chỉ tốn thời gian nén + tải lên/xuống máy chủ GitHub.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Cài gói CHỈ khi package-lock.json hoặc bản Node đổi.
      - name: Install dependencies (only when lockfile changes)
        shell: powershell
        run: |
          # npm in "npm warn …" ra stderr — đừng để PowerShell coi là lỗi; xét $LASTEXITCODE
          $ErrorActionPreference = "Continue"
          $hash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash + "|" + (node -v)
          $mark = "node_modules\.deploy-lock-hash"
          if ((Test-Path $mark) -and ((Get-Content $mark -Raw).Trim() -eq $hash)) {
            Write-Host "package-lock.json + Node unchanged - skip npm ci"
          } else {
            npm ci --prefer-offline --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Set-Content -Path $mark -Value $hash -Encoding ascii
          }

      # 4. Tạo file .env.production và .env để Next.js nhúng NEXT_PUBLIC_* lúc build và nạp runtime
      - name: Create .env files
        shell: powershell
        run: |
          $lines = @()
          $keys = @(
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY",
            "SUPABASE_SERVICE_ROLE_KEY",
            "NEXT_PUBLIC_API_BASE",
            "SDWORK_SUPABASE_URL",
            "SDWORK_SUPABASE_ANON_KEY",
            "SDWORK_WEBHOOK_SECRET",
            "SDWORK_TRACE_URL",
            "NEXT_PUBLIC_SDWORK_FUNCTIONS_URL",
            "NEXT_PUBLIC_SDWORK_ANON_KEY",
            "CREW_CCCD_PEPPER",
            "FORLIFE_GW_KEY",
            "FORLIFE_GW_URL",
            "SDFISH_RENEWAL_SECRET",
            "NEXT_PUBLIC_VAPID_PUBLIC_KEY",
            "ADMIN_PHONES",
            "MASTER_AGENT_PHONES",
            "PORT"
          )
          foreach ($k in $keys) {
            $val = [System.Environment]::GetEnvironmentVariable($k)
            if ($val) {
              $lines += "$k=$val"
            }
          }
          # Nếu server đích đã có .env sẵn, bù thêm các key chưa có trong GitHub
          $dstEnv = "$env:APP_DIR\.env"
          if (Test-Path $dstEnv) {
            Get-Content $dstEnv | ForEach-Object {
              $line = $_.Trim()
              if ($line -and -not $line.StartsWith("#") -and $line.Contains("=")) {
                $parts = $line.Split("=", 2)
                $k = $parts[0].Trim()
                $v = $parts[1].Trim()
                if (-not [System.Environment]::GetEnvironmentVariable($k)) {
                  $lines += "$k=$v"
                }
              }
            }
          }
          $lines | Set-Content -Path ".env.production" -Encoding utf8
          $lines | Set-Content -Path ".env" -Encoding utf8
          Write-Host "Created .env.production and .env with $($lines.Count) variables"

      # 5. Build ứng dụng Next.js (đã có env nạp sẵn). .next/cache còn từ lần trước ⇒ build ấm.
      - name: Build Next.js App
        run: npm run build

      # 5b. Cổng cuối TRƯỚC khi đụng bản đang chạy: còn file dữ liệu rõ (hoặc nhóm
      #     chưa SDF2) thì KHÔNG phát — cùng cổng với deploy.windows-iis.yml.
      - name: Verify encoded data
        run: node scripts/encode-data.mjs --verify --dir public/data

      # 6. Ráp bản chạy được vào STAGE trong lúc web cũ VẪN CHẠY.
      #    robocopy /MIR chỉ chép file khác (so size + giờ sửa), /MT chép song song.
      #    robocopy: mã thoát < 8 là thành công (1 = có chép file) ⇒ phải tự quy về 0.
      - name: Stage new build
        shell: powershell
        run: |
          $src = $env:GITHUB_WORKSPACE
          $std = "$src\.next\standalone"
          $opts = @("/MIR", "/MT:16", "/R:2", "/W:2", "/NFL", "/NDL", "/NJH", "/NP")
          function Invoke-Robo($from, $to) {
            robocopy $from $to @opts | Out-Host
            if ($LASTEXITCODE -ge 8) { throw "robocopy $from -> $to failed (code $LASTEXITCODE)" }
          }

          # Ráp static + public + .env vào standalone (cùng ổ, nhanh)
          Invoke-Robo "$src\.next\static" "$std\.next\static"
          Invoke-Robo "$src\public" "$std\public"
          Copy-Item "$src\.env.production", "$src\.env" -Destination $std -Force -ErrorAction SilentlyContinue

          # Đồng bộ sang stage: chỉ file đổi được chép
          Invoke-Robo $std $env:STAGE_DIR
          exit 0

      # 7. Dừng PM2 CHỈ trong lúc tráo stage → live (robocopy chỉ chép phần khác, vài giây).
      #    Phải dừng vì Windows khoá file .node/.js đang được process dùng.
      - name: Swap stage to live + restart PM2
        shell: powershell
        run: |
          # pm2 báo lỗi ra stderr khi app chưa từng chạy — không được làm hỏng step
          $ErrorActionPreference = "Continue"
          # Giữ bản đang chạy để quay lại (robocopy chỉ chép phần khác, nhanh).
          if (Test-Path "$env:APP_DIR\server.js") {
            robocopy $env:APP_DIR $env:PREV_DIR /MIR /MT:16 /R:2 /W:2 /NFL /NDL /NJH /NP | Out-Host
            if ($LASTEXITCODE -ge 8) { throw "backup live -> prev failed (code $LASTEXITCODE)" }
          }
          pm2 stop forfish 2>$null
          robocopy $env:STAGE_DIR $env:APP_DIR /MIR /MT:16 /R:2 /W:2 /NFL /NDL /NJH /NP | Out-Host
          $rc = $LASTEXITCODE
          Set-Location $env:APP_DIR
          pm2 restart forfish --update-env 2>$null
          if ($LASTEXITCODE -ne 0) {
            pm2 start server.js --name forfish --update-env
          }
          if ($rc -ge 8) { throw "robocopy stage -> live failed (code $rc) - check $env:APP_DIR" }
          exit 0

      # 8. Health check ĐÚNG BẢN (rà Codex 2026-10-18): /api/version phải trả mã
      #    build của commit vừa build — không chỉ "có HTTP". Hỏng ⇒ tráo lại bản
      #    trước (PREV_DIR) và làm job ĐỎ để người thấy.
      - name: Health check + rollback
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $port = if ($env:PORT) { $env:PORT } else { "3000" }
          $want = (git rev-parse --short HEAD).Trim()
          $ok = $false; $got = ""
          foreach ($i in 1..20) {
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/version" -TimeoutSec 5
              $got = "$($r.build)"
              if ($got -and ($want.StartsWith($got) -or $got.StartsWith($want))) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if ($ok) {
            Write-Host "Health OK: build $got"
            # Do tuoi du lieu (khong chan deploy): server song nhung du bao co bi ket o hom qua khong
            try { $s = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/status" -TimeoutSec 15; Write-Host "Du lieu: $($s.duLieu) - ca: $($s.data.fishSnapshot.ageHours)h, thoi tiet: $($s.data.weatherSnapshot.ageHours)h" } catch { Write-Host "Chua doc duoc /api/status" }
            exit 0
          }
          Write-Host "Health FAIL: muon build $want, nhan '$got' - quay lai ban truoc"
          if (Test-Path "$env:PREV_DIR\server.js") {
            pm2 stop forfish 2>$null
            robocopy $env:PREV_DIR $env:APP_DIR /MIR /MT:16 /R:2 /W:2 /NFL /NDL /NJH /NP | Out-Host
            Set-Location $env:APP_DIR
            pm2 restart forfish --update-env 2>$null
          }
          exit 1

      # 9. Smoke test (rà Codex đợt 2): mã bản + /api/status + file dữ liệu là bản
      #    mã + route dữ liệu có gác. KHÔNG chặn (bản đã qua health check ở trên)
      #    — để log nói rõ hỏng ở bước nào.
      - name: Smoke test
        continue-on-error: true
        shell: powershell
        run: |
          $port = if ($env:PORT) { $env:PORT } else { "3000" }
          $sha = (git rev-parse --short HEAD).Trim()
          node scripts/smoke.mjs "http://127.0.0.1:$port" --build $sha
