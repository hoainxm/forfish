name: Deploy Next.js via Self-hosted Runner

on:
  push:
    branches:
      - main # Chạy tự động khi push code lên nhánh main

jobs:
  build-and-deploy:
    runs-on: self-hosted # Quan trọng: Chỉ định chạy trên máy chủ của bạn

    steps:
      # 1. Kéo mã nguồn trực tiếp về thư mục làm việc của Runner trên server
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js (GitHub sẽ tự tải Node.js về cho runner dùng)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'

      # 3. Cài đặt các gói phụ thuộc
      - name: Install dependencies
        run: npm ci

      # 4. Build ứng dụng Next.js
      - name: Build Next.js App
        run: npm run build

      # 5. Tạm dừng PM2 trước khi chép file
      - name: Stop PM2
        run: pm2 stop forfish
        continue-on-error: true # Bỏ qua lỗi nếu ứng dụng chưa từng được chạy trong PM2

      # 6. Copy file bằng PowerShell
      - name: Prepare and Copy files to Destination
        shell: powershell
        run: |
          $src = $env:GITHUB_WORKSPACE
          $dst = "C:\sdfish\forfish"

          # Xóa sạch nội dung bên trong thư mục đích cũ
          Remove-Item -Path "$dst\*" -Recurse -Force -ErrorAction SilentlyContinue
          if (!(Test-Path -Path $dst)) { New-Item -ItemType Directory -Path $dst -Force | Out-Null }

          # Copy nội dung standalone (Khắc phục lỗi leaf item bằng Get-ChildItem)
          Get-ChildItem -Path "$src\.next\standalone" | Copy-Item -Destination $dst -Recurse -Force

          # Tạo sẵn cấu trúc thư mục trước để tránh lỗi chép nhầm
          New-Item -ItemType Directory -Path "$dst\.next" -Force -ErrorAction SilentlyContinue | Out-Null

          # Copy thư mục static và public
          Copy-Item -Path "$src\.next\static" -Destination "$dst\.next\static" -Recurse -Force
          Copy-Item -Path "$src\public" -Destination "$dst\public" -Recurse -Force
      # 7. Khởi động lại PM2
      - name: Restart PM2
        shell: powershell
        run: |
          cd C:\sdfish\forfish
          pm2 restart forfish