# Precompute thời tiết Open-Meteo — gọi /api/cron/refresh-weather theo lịch để
# ghi snapshot Supabase (weather_snapshot). Từ 2026-07-29 client ƯU TIÊN snapshot
# trước live (hạn chế bị khoá IP vì tải nhiều) → snapshot phải TƯƠI theo nhịp
# phát hành GFS (~4 bản/ngày, lib/source-cadence) — Vercel Hobby cron chỉ chạy
# 1 lần/ngày nên GitHub cron 6h này là nguồn tươi chính. Best-effort (có thể
# trễ/bỏ run): snapshot cũ thì client tự rơi về live như trước, không sao.
#
# CẦN CẤU HÌNH (dùng chung với refresh-fish.yml):
#   · Variable  APP_BASE_URL  = URL production, vd https://<app>.vercel.app
#   · Secret    CRON_SECRET   = TRÙNG với env CRON_SECRET đặt trên Vercel
name: refresh-weather-snapshot

on:
  schedule:
    # 04:40 · 10:40 · 16:40 · 22:40 UTC — NGAY SAU mốc phát hành GFS an toàn
    # 04/10/16/22 UTC (OM_RELEASE_HOURS_UTC) để snapshot tươi gần trọn chu kỳ;
    # lệch phút :00 cho đỡ bị GitHub dồn/bỏ.
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-weather
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi cron precompute
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Thiếu vars.APP_BASE_URL hoặc secrets.CRON_SECRET — BỎ QUA lần này (best-effort; client tự rơi về live). Set ở Settings→Secrets and variables→Actions của REPO DEPLOY (hoainxm) để cron chạy thật."; exit 0
          fi
          # bỏ dấu "/" thừa ở cuối APP_BASE_URL → tránh URL //api/... bị 308 redirect
          BASE_URL="${BASE_URL%/}"
          code=$(curl -sS -o resp.json -w "%{http_code}" -m 90 -L \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/refresh-weather")
          echo "HTTP $code"; cat resp.json; echo
          test "$code" = "200"
