const nav=[['sen','audio-lines','Sen Biển'],['sea','map','Bản đồ'],['mine','layout-grid','Của tôi']];
const row=(icon,title,sub,action,badge='')=>`<button class="row" data-a="${action}">${I(icon)}<span><strong>${title}</strong><small>${sub}</small></span>${badge?`<b class="badge">${badge}</b>`:I('chevron-right')}</button>`;
const section=(title,action='',label='Xem tất cả')=>`<div class="section"><h2>${title}</h2>${action?`<button data-a="${action}">${label}</button>`:''}</div>`;
const head=(k,t,a='account',icon='user-round')=>`<header class="head"><div><p class="eyebrow">${k}</p><h1>${t}</h1></div><button class="iconbtn" data-a="${a}" aria-label="${a==='account'?'Tài khoản':a==='cart'?'Giỏ hàng':'Tác vụ'}">${I(icon)}</button></header>`;
const tabs=(s,items)=>`<nav class="tabs" aria-label="Mục con">${items.map(([k,l],i)=>`<button data-tab="${k}" class="${(s.tab||items[0][0])===k?'on':''}">${l}</button>`).join('')}</nav>`;
function sen(s){const f=s.flow||'welcome';const bubbles={weather:['Mai chỗ này sóng thế nào?','Em đang xem điểm anh chọn trên bản đồ. Đây là dự báo mẫu cho ngày mai.'],sell:['Tôi có 500 ký cá thu cần bán.','Em đã soạn tin. Anh bổ sung cảng và thời gian giao rồi kiểm tra trước khi đăng nhé.'],buy:['Mua lại dầu máy lần trước.','Em tìm thấy món trong đơn cũ. Anh xem lại số lượng và giá trước khi đặt.'],docs:['Tàu tôi có giấy nào sắp hết hạn?','Có một giấy cần xem trên tàu KH 92468 TS.'],offline:['Mai tôi nên đi hướng nào?','Hiện đang mất sóng. Em chỉ xem được bản dự báo đã lưu trong máy.'],listen:['','Anh nói việc cần làm nhé.'],done:['Đồng ý.','Đã xác nhận trong bản thiết kế. Chưa gửi tin hay đặt hàng thật.']};let body='';
if(f==='welcome')body=`<div class="sen-welcome"><img src="${senImage}" alt="Sen Biển"><p class="eyebrow">TRỢ LÝ CỦA ANH</p><h1>Hôm nay anh<br>cần Sen giúp gì?</h1><p class="sub">Đi biển, chăm tàu, bán cá hay mua đồ.<br>Anh cứ nói bằng cách của mình.</p></div><div class="suggest"><button data-flow="weather">${I('wind')}Mai biển thế nào?</button><button data-flow="docs">${I('files')}Giấy nào sắp hết hạn?</button><button data-flow="sell">${I('fish')}Tôi muốn bán cá</button><button data-flow="buy">${I('shopping-bag')}Mua lại dầu máy</button></div><div class="resume"><span class="sub">Việc đang dở</span>${row('route','Lộ trình về Hòn Rớ','Tiếp tục trên bản đồ','resume-route')}</div>`;
else{const q=bubbles[f]||bubbles.weather;body=`${f==='offline'?'<div class="mode-note">Mất sóng · đang dùng bản lưu</div>':''}${q[0]?`<div class="utterance">${q[0]}</div>`:''}<div class="sen-answer"><img src="${senImage}" alt=""><p>${q[1]}</p></div>`;if(f==='weather'||f==='offline')body+=`<div class="result"><p class="eyebrow">${f==='offline'?'BẢN LƯU · 18/10, 18:00':'NGÀY MAI · TẠI ĐIỂM ĐANG CHỌN'}</p><h2>Gió cấp 3 · Sóng 0,8 m</h2><p class="sub">12°42′B · 110°09′Đ<br>Số liệu mẫu để duyệt giao diện</p><button class="primary full" data-go="sea">${I('map')}Xem trên bản đồ</button></div>`;
if(f==='sell')body+=`<div class="result"><p class="eyebrow">BẢN NHÁP TIN BÁN</p><h2>Cá thu · 500 kg</h2><label>Cảng giao<input value="Cảng Hòn Rớ" aria-label="Cảng giao"></label><label>Thời gian giao<input value="Sáng mai" aria-label="Thời gian giao"></label><p class="sub">Giá thoả thuận · Người mua gọi trực tiếp</p><button class="primary full" data-flow="confirm-sell">Kiểm tra tin trước khi đăng</button></div>`;
if(f==='buy')body+=`<div class="result"><p class="eyebrow">TỪ ĐƠN ĐÃ MUA · MẪU</p><h2>Dầu máy tàu · can 20 lít</h2><p class="sub">2 can × 1.280.000 đ</p><div class="total"><span>Tiền hàng</span><strong>2.560.000 đ</strong></div><p class="sub">Phí giao sẽ được kiểm tra ở bước tiếp.</p><button class="primary full" data-flow="confirm-buy">Xem đơn trước khi đặt</button><button class="text-action" data-go="supply">Xem các món khác</button></div>`;
if(f==='docs')body+=`<div class="result"><p class="eyebrow">KH 92468 TS · MẪU</p><h2>Đăng kiểm còn 18 ngày</h2><p class="sub">Mở giấy đã lưu để xem thông tin và ngày hết hạn.</p><button class="primary full" data-a="docs">${I('files')}Mở tủ giấy tờ</button></div>`;
if(f==='listen')body+=`<div class="listen"><div class="wave">${I('audio-lines')}</div><h2>Đang nghe…</h2><p class="sub">Mô phỏng thiết kế, không bật micro</p><button class="primary full" data-flow="weather">Thử câu “Mai biển thế nào?”</button><button class="text-action" data-flow="welcome">Dừng</button></div>`;
if(f.startsWith('confirm-')){const buy=f==='confirm-buy';body=`<div class="utterance">${buy?'Xem đơn giúp tôi.':'Kiểm tra tin giúp tôi.'}</div><div class="sen-answer"><img src="${senImage}" alt=""><p>${buy?'Anh kiểm tra đơn này trước khi đặt nhé.':'Anh kiểm tra nội dung sẽ được đăng nhé.'}</p></div><div class="result"><p class="eyebrow">CHỜ ANH XÁC NHẬN</p><h2>${buy?'2 can dầu máy · 20 lít':'Bán cá thu · 500 kg'}</h2><p class="sub">${buy?'Giao tại cảng Hòn Rớ<br>Trả tiền khi nhận<br>Tiền hàng: 2.560.000 đ<br>Phí giao mẫu: 40.000 đ':'Cảng Hòn Rớ · Sáng mai<br>Giá thoả thuận<br>Liên hệ bằng số điện thoại trong hồ sơ'}</p>${buy?'<div class="total"><span>Tổng mẫu</span><strong>2.600.000 đ</strong></div>':''}<button class="primary full" data-flow="done">${buy?'Xác nhận đặt đơn mẫu':'Xác nhận đăng tin mẫu'}</button><button class="text-action" data-flow="${buy?'buy':'sell'}">Sửa lại</button></div>`;}}
return head('SDFISH','Sen Biển')+`<div class="sen-main">${body}</div><form class="composer"><input aria-label="Nói với Sen bằng chữ" placeholder="Hoặc nhắn cho Sen…"><button type="submit" aria-label="Gửi cho Sen">${I('arrow-up')}</button><button type="button" class="speak" data-flow="listen" aria-label="Nói với Sen">${I('mic')}</button></form>`;}
function mine(s){return head('SDFISH','Của tôi')+`<div class="pad"><button class="boat" data-go="boat">${I('ship')}<span><strong>${s.boat}</strong><small>Hồ sơ và chăm sóc tàu</small></span>${I('chevron-right')}</button>${section('Tàu & bạn thuyền')}${row('files','Giấy tờ tàu','Bản chụp, hạn giấy tờ','docs')}${row('users','Sổ bạn thuyền','Danh bạ chung của chủ tàu','crew')}${row('wrench','Thiết bị & dịch vụ','Bảo dưỡng, bảo hành, VMS','care')}${section('Mua & bán')}<div class="quick"><button data-go="fish">${I('fish')}Chợ cá</button><button data-go="supply">${I('shopping-bag')}Vật tư</button></div>${row('package','Đơn mua của tôi','Theo dõi đơn và mua lại','orders')}${row('notebook-pen','Tin cá đã đăng','Xem, sửa và đóng tin','my-posts')}<p class="price-note">Dữ liệu mẫu · giao diện đề xuất</p></div>`;}

function home(s){return head('SDFISH','Chào anh Hải')+`<div class="pad"><div class="hero"><p class="eyebrow">RA KHƠI</p><h2>Nhìn rõ biển.<br>Chọn đúng hướng.</h2><p class="sub">Ngư trường, gió sóng và đường đi<br>trên cùng một bản đồ.</p><button class="primary" data-go="sea">${I('navigation')}Mở bản đồ</button></div>${section('Việc cần xem')}<button class="notice" data-a="docs">${I('file-clock')}<span>Giấy đăng kiểm còn 18 ngày<br><small>${s.boat}</small></span></button>${row('package','Đơn vật tư đang giao','Xem đơn và liên hệ cửa hàng','orders')}${section('Trước và sau chuyến biển')}<div class="quick"><button data-go="fish">${I('fish')}Giá & chỗ bán cá</button><button data-go="supply">${I('shopping-bag')}Mua đồ đi biển</button></div>${row('users','Sổ bạn thuyền','Danh bạ chung của anh','crew')}<p class="price-note">Bản thiết kế · thông tin và số liệu mẫu</p></div>`;}

function draw(p){const el=p.querySelector('.geo');if(!el||!globalThis.d3)return;const w=el.clientWidth||388,h=690,projection=d3.geoMercator().center([110.05,12.65]).translate([w*.5,h*.47]).scale(w*15.7),path=d3.geoPath(projection),svg=d3.select(el).attr('viewBox',`0 0 ${w} ${h}`);svg.selectAll('*').remove();svg.append('path').datum(d3.geoGraticule().step([.5,.5])()).attr('d',path).attr('stroke','var(--p-ink)').attr('opacity',.06).attr('fill','none');for(let x=109.9;x<112;x+=.15)for(let y=11;y<15;y+=.15){const v=Math.sin(x*8+y*4)+Math.cos(y*6);if(v<.6)continue;const a=projection([x,y]),b=projection([x+.14,y+.14]);svg.append('rect').attr('x',a[0]).attr('y',b[1]).attr('width',b[0]-a[0]).attr('height',a[1]-b[1]).attr('rx',2).attr('fill',v>1.5?'#ef4444':v>1?'#eab308':'#22c55e').attr('opacity',.24);}svg.append('g').selectAll('path').data(geo.features).join('path').attr('d',path).attr('fill','var(--p-land)').attr('stroke','var(--p-line)');[['Quy Nhơn',109.223,13.776],['Tuy Hoà',109.3,13.1],['Nha Trang',109.196,12.245],['Cam Ranh',109.16,11.9]].forEach(([n,x,y])=>{const a=projection([x,y]);svg.append('text').attr('x',a[0]-7).attr('y',a[1]).attr('text-anchor','end').attr('fill','var(--p-sub)').attr('font-size',11).text(n);});}

function restore(v){for(const [k,s] of Object.entries(v?.privateContent?.state||{}))if(state[k]&&['sen','sea','mine','boat','fish','supply'].includes(s.page))Object.assign(state[k],s);}
restore(window.openai?.widgetState);phones.forEach(render);
root.addEventListener('click',e=>{const b=e.target.closest('button'),p=b?.closest('.phone');if(!p)return;const s=state[p.dataset.start];if(b.dataset.flow){s.page='sen';s.flow=b.dataset.flow;s.modal=null;}else if(b.dataset.go){s.page=b.dataset.go;s.tab=null;s.modal=null;}else if(b.dataset.tab){s.tab=b.dataset.tab;s.modal=null;}else if(b.dataset.day!==undefined){s.day=+b.dataset.day;}else if(b.dataset.cat){s.category=b.dataset.cat;}else if(b.dataset.boat){s.boat=b.dataset.boat;s.modal=null;}else if(b.dataset.product){s.product=b.dataset.product;s.modal='product';}else{const a=b.dataset.a;if(a==='stop-drive'){s.driving=false;s.modal=null;}else if(a==='run'){s.driving=true;s.modal=null;}else if(a==='ask-sen'){s.flow=s.page==='fish'?'sell':s.page==='supply'?'buy':s.page==='sea'?'weather':'docs';s.page='sen';s.modal=null;}else if(a==='resume-route'){s.page='sea';s.modal='route';}else if(a==='close')s.modal=null;else if(a==='crew'||a==='care'){s.page='boat';s.tab=a;s.modal=null;}else if(a==='buyers'){s.page='fish';s.tab='buyers';s.modal=null;}else if(a==='orders'||a==='shop'||a==='supply'){s.page='supply';s.tab=a==='orders'?'orders':'shop';s.modal=null;}else if(a==='add-cart'){s.cart++;s.modal='cart';}else if(a!=='noop')s.modal=a;}render(p);save();});
root.addEventListener('input',e=>{const p=e.target.closest('.phone');if(!p)return;const q=e.target.value.toLocaleLowerCase('vi-VN');if(e.target.dataset.search==='crew')p.querySelectorAll('[data-crew] .row').forEach(el=>el.hidden=!el.textContent.toLocaleLowerCase('vi-VN').includes(q));if(e.target.dataset.search==='product')p.querySelectorAll('[data-products] .product').forEach(el=>el.hidden=!el.textContent.toLocaleLowerCase('vi-VN').includes(q));});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);phones.forEach(render);}});root.addEventListener('submit',e=>{e.preventDefault();const p=e.target.closest('.phone');if(!p)return;const s=state[p.dataset.start],q=e.target.querySelector('input').value.toLocaleLowerCase('vi-VN');s.flow=/bán|cá thu/.test(q)?'sell':/mua|dầu|đơn/.test(q)?'buy':/giấy|hạn|đăng kiểm/.test(q)?'docs':'weather';s.page='sen';render(p);save();});const ro=new ResizeObserver(es=>es.forEach(e=>{if(e.contentRect.width)draw(e.target);}));phones.forEach(p=>ro.observe(p));
})();
</script>
