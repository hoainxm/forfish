			shellScript = "# Sen Biển Gemma (doc 15 §25): chép mô hình vào gói app NẾU máy build có file.\n# Nguồn: release sen-bien-gemma-v2 (gemma.litertlm 62 MB) — CÙNG file Android, kiểm CÙNG SHA-256.\nSRC=\"${SRCROOT}/sen-bien-gemma/gemma.litertlm\"\nDST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/sen-bien\"\nif [ -f \"$SRC\" ]; then\n  want=$(cut -d\" \" -f1 \"${SRCROOT}/../../android/sen-bien-gemma/gemma.sha256\")\n  got=$(shasum -a 256 \"$SRC\" | cut -d\" \" -f1)\n  if [ \"$want\" != \"$got\" ]; then echo \"error: ios/App/sen-bien-gemma/gemma.litertlm sai SHA-256 (cần $want)\"; exit 1; fi\n  mkdir -p \"$DST\" && cp -f \"$SRC\" \"$DST/gemma.litertlm\"\n  # NOTICE Gemma Terms §3.1 (ADR 0012) — dùng chung bản của gói Android\n  cp -f \"${SRCROOT}/../../android/sen-bien-gemma/src/main/assets/sen-bien/NOTICE.txt\" \"$DST/NOTICE.txt\"\nelse\n  rm -f \"$DST/gemma.litertlm\" \"$DST/NOTICE.txt\"\n  echo \"warning: Không có ios/App/sen-bien-gemma/gemma.litertlm — bản này Sen Biển chạy n-gram + luật (không Gemma)\"\nfi\n";
